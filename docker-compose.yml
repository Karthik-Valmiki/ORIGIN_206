services:
  postgres:
    image: postgres:16-alpine
    container_name: lmpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: ORIGIN_DB
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ORIGIN_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: lmpc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:pass123@postgres:5432/ORIGIN_DB
      SECRET_KEY: lmpc-sih-2026-super-secret-key-change-in-prod
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - ./backend/app:/app/app   # hot-reload: only app source, not site-packages
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
