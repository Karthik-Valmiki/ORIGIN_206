services:
  postgres:
    image: postgres:15-alpine
    container_name: sih26034_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-sih_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sih_password}
      POSTGRES_DB: ${DB_NAME:-sih_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sih_user} -d ${DB_NAME:-sih_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sih26034_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: sih26034_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-sih_user}:${DB_PASSWORD:-sih_password}@postgres:5432/${DB_NAME:-sih_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: sih26034_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-sih_user}:${DB_PASSWORD:-sih_password}@postgres:5432/${DB_NAME:-sih_db}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads


volumes:
  postgres_data:
  redis_data:
  uploads_data:
